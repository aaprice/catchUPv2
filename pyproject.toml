[project]
name = "catchup-ember-crypt"
version = "0.1.0"
description = "Learn modern AI engineering (harnesses, tools, MCP, loops, multi-agent, evals) on a tiny roguelike"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "mcp>=2.2",          # MCP SDK v2 (MCPServer + Client). Old tutorials say FastMCP = v1 name; see module 05
  "pytest>=8",
]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.1"]   # module 08 optional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
